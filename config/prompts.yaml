# Configuración del puente LLM (F2).
#
# El LLM se invoca por CLI, con subprocess. Sin claves de API acá ni en ningún otro lado
# del repo: se usa la CLI que ya tenés autenticada. Ver ADR-008.
#
# PRIVACIDAD: el fragmento de transcripción se le manda a la CLI que elijas. Con `ollama`
# no sale de la máquina. Con `claude` viaja al proveedor. Si las reuniones son sensibles,
# poné una CLI local primero en la lista.

version: 1

cli:
  # Se prueban en orden. Se usa la primera que esté instalada y responda.
  candidatos:
    # El orden importa: se usa la primera instalada. Local primero, por privacidad.
    #
    # --think=false apaga el razonamiento del modelo. Es la diferencia entre 4.10 s y
    # 0.46 s por respuesta, medido en este equipo con la misma pregunta. Ojo con la
    # forma: `--think false` NO lo apaga, hay que escribirlo con el signo igual.
    #
    # --keepalive deja el modelo en memoria entre preguntas. Sin esto ollama lo descarga
    # a los 5 minutos y la primera pregunta después de una pausa paga la recarga.
    - id: ollama
      comando: [ollama, run, gemma4, --think=false, --hidethinking, --nowordwrap,
                --keepalive, 30m]
      local: true

    # El mismo modelo, razonando antes de contestar. Diez veces más lento; se elige a
    # mano desde la ventana cuando la respuesta importa más que el tiempo.
    - id: ollama-razonando
      comando: [ollama, run, gemma4, --hidethinking, --nowordwrap, --keepalive, 30m]
      local: true

    - id: claude
      comando: [claude, -p]
      local: false

  timeout_s: 120

# Cada plantilla recibe:
#   {fragmento}      el texto seleccionado de la transcripción
#   {contexto}       los segmentos previos, para dar contexto
#   {instrucciones}  lo que el usuario escribió en el cuadro de la ventana: quién es,
#                    en qué situación está y cómo quiere que le contesten. Llega ya
#                    formateado, o vacío; la plantilla sólo tiene que dejarle un renglón
#   {idioma}     idioma en el que se quiere la salida
#
# Cualquier otro marcador entre llaves hace fallar la carga: es un typo, no una feature.

# `idioma` dice en qué idioma tiene que contestar el modelo:
#   fragmento — el mismo idioma de lo que se dijo. Para responderle a quien habló.
#   propio    — el idioma en el que yo leo. Para traducir, explicar o resumir.
prompts:
  - id: responder
    corto: Responder
    idioma: fragmento
    # Apenas termina esta, la ventana pide la ampliación sola.
    ampliar_con: ampliar
    nombre: Redactar respuesta
    descripcion: Redacta una respuesta a lo que se acaba de decir.
    plantilla: |
      {instrucciones}
      Contexto de la reunión:
      {contexto}

      Lo que acaban de decir:
      {fragmento}

      Redactá una respuesta breve y profesional en {idioma}. Solo la respuesta,
      sin preámbulo ni comentarios sobre la tarea.

  - id: ampliar
    idioma: fragmento
    # Acá sí conviene que razone: es la respuesta que se pide cuando hay tiempo.
    cli: ollama-razonando
    corto: Ampliar
    nombre: Desarrollar la respuesta
    descripcion: Toma la respuesta corta y la desarrolla, con alternativas y por qué.
    plantilla: |
      {instrucciones}
      Contexto de la reunión:
      {contexto}

      Lo que acaban de decir:
      {fragmento}

      Ya hay una respuesta corta redactada:
      {respuesta}

      Desarrollala en {idioma}. Dame:
      1. Una versión más completa de la respuesta, lista para decir en voz alta.
      2. Dos alternativas con un tono distinto, una frase cada una.
      3. Qué conviene tener en cuenta antes de contestar, en dos o tres puntos.

      Sin preámbulo ni comentarios sobre la tarea.

  - id: traducir_bien
    idioma: propio
    corto: Traducir
    nombre: Traducir con cuidado
    descripcion: Traducción de calidad, más lenta que la del subtitulado en vivo.
    plantilla: |
      Traducí al {idioma}, respetando el registro y la terminología técnica.
      Devolvé solo la traducción.

      {fragmento}

  - id: aclarar
    idioma: propio
    corto: Explicar
    nombre: Explicar qué quisieron decir
    descripcion: Desambigua jerga, siglas o una frase confusa.
    plantilla: |
      {instrucciones}
      Contexto de la reunión:
      {contexto}

      Explicá en {idioma} qué significa esto, incluyendo cualquier sigla o jerga:

      {fragmento}

  - id: resumir
    idioma: propio
    corto: Resumir
    nombre: Resumir lo hablado
    descripcion: Resume el tramo seleccionado en puntos.
    plantilla: |
      {instrucciones}
      Resumí en {idioma}, en tres o cuatro puntos, lo hablado acá:

      {fragmento}

  # ------------------------------------------------------------------ fin de reunión
  # Estas dos corren sobre la conversación entera, no sobre una selección. Por eso
  # `alcance: sesion`: así no aparecen como botón encima de cada frase.

  - id: resumen_parte
    alcance: sesion
    idioma: propio
    corto: Tramo
    nombre: Resumir un tramo de la reunión
    descripcion: Paso intermedio, cuando la reunión no entra de una en el contexto.
    plantilla: |
      Este es un tramo de la transcripción de una reunión.

      {fragmento}

      Anotá en {idioma}, en punteo seco y sin preámbulo: los temas que se tocaron, las
      decisiones, las tareas con su responsable, las cifras y fechas que se dijeron, y
      las preguntas que quedaron abiertas. No agregues nada que no esté en el texto.

  - id: resumen_reunion
    alcance: sesion
    idioma: propio
    # Un resumen se pide una vez, al final. Acá el tiempo importa menos que la calidad.
    cli: ollama-razonando
    corto: Resumen
    nombre: Resumen de la reunión
    descripcion: Manda toda la conversación y arma un resumen detallado, al terminar.
    plantilla: |
      {instrucciones}
      Esto es la transcripción de una reunión, o las notas de cada uno de sus tramos.
      Viene de un reconocimiento de voz automático, así que puede tener palabras mal
      transcritas: interpretá con sentido común y no cites al pie de la letra algo que
      claramente salió mal.

      {fragmento}

      Escribí en {idioma} un resumen detallado, con estas secciones, en este orden y con
      estos títulos. Si una sección no tiene contenido, poné un guion debajo y seguí.

      **Resumen**
      Dos o tres frases sobre de qué se trató la reunión.

      **Temas**
      Un punto por tema, con lo que se dijo de cada uno.

      **Decisiones**
      Qué se decidió y, si se dijo, por qué.

      **Tareas**
      Un punto por tarea: qué hay que hacer, quién y para cuándo. Si no se dijo quién o
      cuándo, escribí la tarea igual y aclará que quedó sin definir.

      **Preguntas abiertas**
      Lo que quedó sin resolver.

      **Datos y cifras**
      Números, fechas, nombres propios y siglas que se mencionaron.

      No inventes nada que no esté en la transcripción. Sin preámbulo ni comentarios
      sobre la tarea.

  - id: titulo_reunion
    alcance: sesion
    idioma: propio
    corto: Título
    nombre: Título de la reunión
    descripcion: Nombra la reunión en pocas palabras, a partir del resumen ya escrito.
    plantilla: |
      Este es el resumen de una reunión:

      {fragmento}

      Devolvé un título de entre tres y ocho palabras en {idioma} que diga de qué se
      trató. Solo el título, en un renglón, sin comillas, sin punto final y sin ninguna
      palabra más.
