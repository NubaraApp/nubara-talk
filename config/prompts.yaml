# Configuración del puente LLM (F2).
#
# El LLM se invoca por CLI, con subprocess. Sin claves de API acá ni en ningún otro lado
# del repo: se usa la CLI que ya tenés autenticada. Ver ADR-008.
#
# PRIVACIDAD: el fragmento de transcripción se le manda a la CLI que elijas. Con `ollama`
# no sale de la máquina. Con `claude` viaja al proveedor. Si las reuniones son sensibles,
# poné una CLI local primero en la lista.

version: 1

cli:
  # Se prueban en orden. Se usa la primera que esté instalada y responda.
  candidatos:
    - id: ollama
      comando: [ollama, run, gemma4, --hidethinking, --nowordwrap]
      local: true
    - id: claude
      comando: [claude, -p]
      local: false

  timeout_s: 120

# Cada plantilla recibe:
#   {fragmento}  el texto seleccionado de la transcripción
#   {contexto}   los segmentos previos, para dar contexto
#   {idioma}     idioma en el que se quiere la salida
#
# Cualquier otro marcador entre llaves hace fallar la carga: es un typo, no una feature.

prompts:
  - id: responder
    nombre: Redactar respuesta
    descripcion: Redacta una respuesta a lo que se acaba de decir.
    plantilla: |
      Contexto de la reunión:
      {contexto}

      Lo que acaban de decir:
      {fragmento}

      Redactá una respuesta breve y profesional en {idioma}. Solo la respuesta,
      sin preámbulo ni comentarios sobre la tarea.

  - id: traducir_bien
    nombre: Traducir con cuidado
    descripcion: Traducción de calidad, más lenta que la del subtitulado en vivo.
    plantilla: |
      Traducí al {idioma}, respetando el registro y la terminología técnica.
      Devolvé solo la traducción.

      {fragmento}

  - id: aclarar
    nombre: Explicar qué quisieron decir
    descripcion: Desambigua jerga, siglas o una frase confusa.
    plantilla: |
      Contexto de la reunión:
      {contexto}

      Explicá en {idioma} qué significa esto, incluyendo cualquier sigla o jerga:

      {fragmento}

  - id: resumir
    nombre: Resumir lo hablado
    descripcion: Resume el tramo seleccionado en puntos.
    plantilla: |
      Resumí en {idioma}, en tres o cuatro puntos, lo hablado acá:

      {fragmento}
